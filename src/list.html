<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game List - Quantum Chess</title>
  <style>
    body { 
      font-family: 'Courier New', monospace;    
      font-weight: 300;
      background-color: black;
      color: white;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-weight: 300;
      margin-bottom: 30px;
      text-align: center;
      display: none;
    }
    .games-list {
      margin-top: 30px;
      display: grid;
      gap: 15px;
    }
    .game-item {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .game-item:hover {
      border-color: #555;
      background: #222;
    }
    .game-info {
      flex: 1;
    }
    .game-id {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #999;
      margin-bottom: 8px;
    }
    .game-status {
      font-size: 16px;
      font-weight: 400;
    }
    .game-status.ongoing {
      color: #4CAF50;
    }
    .game-status.blue_victory {
      color: #2196F3;
    }
    .game-status.red_victory {
      color: #f44336;
    }
    .game-status.tie {
      color: #FF9800;
    }
    .game-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #f0f0f0;
      border: none;
      border-radius: 2em;
      color: #333;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 10px 20px;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover {
      background: #e0e0e0;
    }
    .btn-primary {
      background: #f0f0f0;
      color: #333;
    }
    .btn-primary:hover {
      background: #e0e0e0;
    }
    .refresh-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
    }
    .refresh-btn .btn {
      padding: 8px 12px;
      font-size: 16px;
      transition: transform 0.3s ease;
    }
    .refresh-btn .btn.rotating {
      animation: rotate 0.5s linear;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #666;
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .load-more-trigger {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }
    .end-of-list {
      text-align: center;
      padding: 40px;
      color: #666;
      font-style: italic;
    }
    .purge-section {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
    }
    .btn-danger {
      background: #dc3545;
      color: white;
      border: none;
    }
    .btn-danger:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quantum Chess Games</h1>
    <div class="refresh-btn">
      <button class="btn btn-primary" onclick="loadGames()" title="Refresh">Refresh</button>
    </div>
    <div id="purge-section" class="purge-section" style="display: none;">
      <button class="btn btn-danger" onclick="purgeAllGames()" title="Delete all games">Purge All Games</button>
    </div>
    <div id="games-list" class="games-list">
      <div class="loading">Loading games...</div>
    </div>
  </div>

  <script>
    // Check if purge is enabled from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const purgeEnabled = urlParams.get('purge') === 'true';
    if (purgeEnabled) {
      document.getElementById('purge-section').style.display = 'block';
    }

    // Pagination state
    let currentPage = 0;
    const pageSize = 20;
    let isLoading = false;
    let hasMoreGames = true;
    let totalGamesLoaded = 0;

    async function purgeAllGames() {
      if (!confirm('Are you sure you want to delete all games? This action cannot be undone.')) {
        return;
      }
      
      try {
        const response = await fetch('/api/purge', { method: 'DELETE' });
        const result = await response.json();
        
        if (response.ok) {
          alert(`Successfully deleted ${result.deleted} games.`);
          // Reload the games list
          loadGames();
        } else {
          alert(`Error: ${result.error || 'Failed to purge games'}`);
        }
      } catch (error) {
        console.error('Error purging games:', error);
        alert('Failed to purge games. Please try again.');
      }
    }

    async function loadGames(append = false) {
      if (isLoading || (!append && !hasMoreGames)) return;
      
      isLoading = true;
      const refreshBtn = document.querySelector('.refresh-btn .btn');
      if (!append) {
        refreshBtn.classList.add('rotating');
        currentPage = 0;
        totalGamesLoaded = 0;
        hasMoreGames = true;
      }
      
      const listEl = document.getElementById('games-list');
      
      // Show loading indicator
      if (!append) {
        listEl.innerHTML = '<div class="loading">Loading games...</div>';
      } else {
        // Add loading spinner at the bottom
        const loadingEl = document.createElement('div');
        loadingEl.className = 'load-more-trigger';
        loadingEl.innerHTML = '<div class="loading-spinner"></div>Loading more games...';
        loadingEl.id = 'loading-indicator';
        listEl.appendChild(loadingEl);
      }
      
      try {
        const offset = append ? totalGamesLoaded : 0;
        const response = await fetch(`/api/games?limit=${pageSize}&offset=${offset}`);
        const games = await response.json();
        
        // Remove loading indicator
        const loadingIndicator = document.getElementById('loading-indicator');
        if (loadingIndicator) {
          loadingIndicator.remove();
        }
        
        if (games.length === 0) {
          hasMoreGames = false;
          if (!append && totalGamesLoaded === 0) {
            listEl.innerHTML = '<div class="empty-state">No active games. Games expire after 48 hours of inactivity.</div>';
          } else if (append) {
            const endEl = document.createElement('div');
            endEl.className = 'end-of-list';
            endEl.textContent = totalGamesLoaded > 0 ? 'End of games list' : 'No active games found';
            listEl.appendChild(endEl);
          }
          return;
        }
        
        const gamesHTML = games.map(game => {
          const statusClass = game.gameState === 'ongoing' ? 'ongoing' : 
                             game.gameState === 'blue_victory' ? 'blue_victory' :
                             game.gameState === 'red_victory' ? 'red_victory' : 'tie';
          const statusText = game.gameState === 'ongoing' ? 'Ongoing' :
                            game.gameState === 'blue_victory' ? 'Blue Won' :
                            game.gameState === 'red_victory' ? 'Red Won' : 'Tie';
          const timeAgo = getTimeAgo(game.lastAccessed);
          
          return `
            <div class="game-item">
              <div class="game-info">
                <div class="game-id">${game.id.substring(0, 16)}...</div>
                <div class="game-status ${statusClass}">${statusText}</div>
                <div style="font-size: 12px; color: #666; margin-top: 5px;">Last active: ${timeAgo}</div>
              </div>
              <div class="game-actions">
                <a href="/game/${game.id}" class="btn btn-primary">Join Game</a>
              </div>
            </div>
          `;
        }).join('');
        
        if (append) {
          // Append new games to existing list
          listEl.insertAdjacentHTML('beforeend', gamesHTML);
        } else {
          // Replace entire list
          listEl.innerHTML = gamesHTML;
        }
        
        totalGamesLoaded += games.length;
        
        // Check if there might be more games
        if (games.length < pageSize) {
          hasMoreGames = false;
          if (append) {
            const endEl = document.createElement('div');
            endEl.className = 'end-of-list';
            endEl.textContent = 'End of games list';
            listEl.appendChild(endEl);
          }
        }
        
      } catch (error) {
        const loadingIndicator = document.getElementById('loading-indicator');
        if (loadingIndicator) {
          loadingIndicator.remove();
        }
        
        if (!append && totalGamesLoaded === 0) {
          listEl.innerHTML = '<div class="empty-state">Error loading games. Please try again.</div>';
        } else {
          const errorEl = document.createElement('div');
          errorEl.className = 'empty-state';
          errorEl.textContent = 'Error loading more games. Please try again.';
          listEl.appendChild(errorEl);
        }
        console.error('Error loading games:', error);
      } finally {
        isLoading = false;
        if (!append) {
          setTimeout(() => {
            refreshBtn.classList.remove('rotating');
          }, 500);
        }
      }
    }
    
    function getTimeAgo(timestamp) {
      const seconds = Math.floor((Date.now() - timestamp) / 1000);
      if (seconds < 60) return 'just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} hour${hours > 1 ? 's' : ''} ago`;
      const days = Math.floor(hours / 24);
      return `${days} day${days > 1 ? 's' : ''} ago`;
    }
    
    // Infinite scroll functionality
    function setupInfiniteScroll() {
      const threshold = 200; // Load more when 200px from bottom
      
      window.addEventListener('scroll', () => {
        if (isLoading || !hasMoreGames) return;
        
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;
        
        // Check if user is near the bottom
        if (scrollTop + windowHeight >= documentHeight - threshold) {
          loadGames(true); // Append mode
        }
      });
    }
    
    // Load games on page load
    loadGames();
    
    // Setup infinite scroll after initial load
    setupInfiniteScroll();
    
    // Auto-refresh every 30 seconds (only resets pagination)
    setInterval(() => {
      if (!isLoading) {
        loadGames(); // Reset and reload
      }
    }, 30000);
  </script>
</body>
</html>
