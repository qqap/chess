<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Chess</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Courier New', monospace;    
      font-weight: 300;
      background-color: black;
      color: white;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 30px;
      box-sizing: border-box;
    }
    .parent{
    text-align: center;
    width: 100%;
    align-items: center;
    justify-content: center;
}
/* .parent .center-div{
    display: inline-block;
} */
    .header-container {
      display: flex;
      align-items: center;
      gap: 20px;
      justify-content: flex-start;
      width: fit-content;
      /* max-width: auto; */
      margin: 0 auto;
    }
    h1 {
      font-family: 'Press Start 2P', cursive;
      font-weight: 400;
      font-size: 48px;
      margin: 0;
      text-align: left;
      line-height: 1.2;
      color: #ffffff;
      background-color: #808080;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .icon-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .main-icon {
      width: 80px;
      height: 80px;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }
    .subtitle {
      font-size: 16px;
      color: #999;
      margin-top: -20px;
      text-align: center;
    }
    .button-container {
      display: flex;
      gap: 15px;
      flex-direction: column;
      align-items: center;
    }
    .btn {
      background: #f0f0f0;
      border: none;
      border-radius: 2em;
      color: #333;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 10px;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
      min-width: 200px;
      text-align: center;
    }
    .btn:hover {
      background: #e0e0e0;
      /* transform: translateY(-2px); */
    }
    .btn:active {
      transform: translateY(0);
    }
    .link {
      color: #999;
      text-decoration: none;
      font-size: 16px;
    }
    .link:hover {
      color: #ccc;
    }
    .rules-text {
      font-size: 18px;
      color: #999;
      text-align: center;
      max-width: 90%;
      margin: 0 auto;
      line-height: 1.4;
    }
    
    /* Mobile responsive styles */
    @media (max-width: 768px) {
      body {
        gap: 15px;
        padding: 15px;
        min-height: 100vh;
      }
      .header-container {
        gap: 15px;
        /* max-width: 100%; */
      }
      h1 {
        font-size: 32px;
      }
      .main-icon {
        width: 60px;
        height: 60px;
      }
      .btn {
        font-size: 14px;
        min-width: 160px;
        padding: 8px;
      }
      .link {
        font-size: 14px;
      }
      .rules-text {
        font-size: 16px;
        max-width: 95%;
      }
    }
    
    @media (max-width: 480px) {
      body {
        gap: 10px;
        padding: 10px;
        min-height: 100vh;
      }
      .header-container {
        gap: 10px;
      }
      h1 {
        font-size: 24px;
      }
      .main-icon {
        width: 48px;
        height: 48px;
      }
      .btn {
        font-size: 12px;
        min-width: 140px;
        padding: 6px;
      }
      .rules-text {
        font-size: 14px;
        max-width: 98%;
        line-height: 1.3;
      }
    }
  </style>
</head>
<body>
  <div class="parent">
  <div class="header-container">
    <div class="icon-container">
      <img class="main-icon" src="/favicon.ico" alt="Quantum Chess Icon">
    </div>
    <h1>Quantum<br>Chess</h1>
  </div>
  </div>
  <i class="rules-text">The rules are simple, whatever the computer allows</i>
  <div class="button-container">
    <button class="btn" onclick="createNewGame()">New Game</button>
    <a href="/list" class="link">View Active Games</a>
  </div>

  <script>
    function createNewGame() {
      // Generate a unique game ID
      const uuid = crypto.randomUUID().replace(/-/g, '');
      // Navigate to the game page
      window.location.href = `/game/${uuid}`;
    }
  </script>
</body>
</html>
