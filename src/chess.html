    table.chessboard {

      table-layout: fixed;

    table.chessboard td {

    table.chessboard td.coord {

      text-align: center;

    table.chessboard td canvas {

    .square-black {

    }

    .square-white {

    .coord {

  <script>
    let ws = null;

    function makeWebSocketCall(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
      }
    }

    // Connect to WebSocket
    function connectWebSocket() {
      const roomId = 'default'; // Use a default room for now
      const wsUrl = `/api/room/${roomId}/websocket`;
      
      ws = new WebSocket(wsUrl.replace('http', 'ws'));
      
      ws.onopen = function() {
        console.log('Connected to chess game');
        document.getElementById('debug').innerHTML += 'Connected to chess game' + '\n';
        // ASCII art welcome message
        document.getElementById('debug').innerHTML += '<div style="color: #666; font-family: monospace; line-height: 1; font-size: 10px; margin: 10px 0;">' +
          '         ,....,<br>' +
          '      ,::::::<&lt;<br>' +
          '     ,::/^\\"``..<br>' +
          '    ,::/, `   e`.<br>' +
          '   ,::; |        \'.<br>' +
          '   ,::|  \\___,-.  c)<br>' +
          '   ;::|     \\   \'-\'<br>' +
          '   ;::|      \\<br>' +
          '   ;::|   _.=`\\<br>' +
          '   `;:|.=` _.=`\\<br>' +
          '     \'|_.=`   __\\<br>' +
          '     `\\_..==`` /<br>' +
          '      .\'.___.-\'.<br>' +
          '     /          \\<br>' +
          '    (\'--......--\')<br>' +
          '    /\'--......--\'\\<br>' +
          '    `"--......--"<br>' +
          '</div>';
        document.getElementById('debug').innerHTML += '<span style="color: #999;">Rules are simple, whatever the computer allows, try double clicking some squares! :)</span><br>' + '\n';
      };
      
      ws.onmessage = function(event) {
        const data = JSON.parse(event.data);
        console.log('Received:', data);
        printBoard(data.board);
        if (data.type === 'board') {
          updateBoard(data.board);
        }
      };
      
      ws.onclose = function() {
        console.log('Disconnected from chess game');
        document.getElementById('debug').innerHTML += 'Disconnected from chess game' + '\n';
      };
      
      ws.onerror = function(error) {
        console.error('WebSocket error:', error);
        document.getElementById('debug').innerHTML += 'WebSocket error: ' + error + '\n';
      };
    }
    
    // Connect when page loads
    connectWebSocket();

    function printBoard(board) {
      console.log('Board state:');
      for (let row = 0; row < 8; row++) {
        let rowStr = '';
        for (let col = 0; col < 8; col++) {
          const piece = board[row][col];
          if (piece) {
            // Use colored styling for pieces
            if (piece === piece.toUpperCase()) {
              // White pieces - blue color
              rowStr += `<span style="color: #0066cc; font-weight: bold;">${piece}</span> `;
            } else {
              // Black pieces - red color
              rowStr += `<span style="color: #cc0000; font-weight: bold;">${piece}</span> `;
            }
          } else {
            // Empty square
            rowStr += '<span style="color: #999;">.</span> ';
          }
        }
        console.log(`${8 - row}: ${rowStr}`);
        document.getElementById('debug').innerHTML += `<div style="font-family: monospace; line-height: 1.2;">${8 - row}: ${rowStr}</div>`;
      }
      document.getElementById('debug').innerHTML += '<div style="font-family: monospace; margin-bottom: 10px;">   a b c d e f g h</div>';
    }

    function updateBoard(board) {
      console.log('Updating board:', board);
      document.getElementById('debug').innerHTML += 'Updating board' + '\n';

      const PIECES = {
        'K': '/pieces/simple/white_king_alive.png',
        'Q': '/pieces/simple/white_queen_alive.png', 
        'R': '/pieces/simple/white_rook_alive.png',
        'B': '/pieces/simple/white_bishop_alive.png',
        'N': '/pieces/simple/white_knight_alive.png',
        'P': '/pieces/simple/white_pawn_alive.png',
        'k': '/pieces/simple/black_king_alive.png',
        'q': '/pieces/simple/black_queen_alive.png',
        'r': '/pieces/simple/black_rook_alive.png',
        'b': '/pieces/simple/black_bishop_alive.png',
        'n': '/pieces/simple/black_knight_alive.png',
        'p': '/pieces/simple/black_pawn_alive.png'
      };

      // Iterate through the board and update each square
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = board[row][col];
          const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
          const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
          const squareId = `sq-${files[col]}${ranks[row]}`;
          const canvas = document.getElementById(squareId);
          
          if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = 1000;
            canvas.height = 1000;
            
            // Clear the square
            ctx.clearRect(0, 0, 1000, 1000);
            
            // Draw piece if present
            if (piece && PIECES[piece]) {
              const img = new Image();
              img.onload = function() {
                ctx.drawImage(img, 0, 0, 1000, 1000);
              };
              img.src = PIECES[piece];
            }
          }
        }
      }
     

    // Track selected square
    let selectedSquare = null;
    let clickCount = 0;

    // Add click handlers to all squares - using window.onload instead of DOMContentLoaded
      console.log('Window loaded');
      document.getElementById('debug').innerHTML += 'Window loaded' + '\n';
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
          const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
          const squareId = `sq-${files[col]}${ranks[row]}`;
          const canvas = document.getElementById(squareId);
          
          if (canvas) {
            canvas.addEventListener('click', function() {
              handleSquareClick(squareId, row, col);
            });
          }
        }
      }
    

    function handleSquareClick(squareId, row, col) {
      console.log('handleSquareClick', squareId, row, col);
      document.getElementById('debug').innerHTML += 'handleSquareClick' + ' ' + squareId + ' ' + row + ' ' + col + '\n';
      const canvas = document.getElementById(squareId);
      if (!canvas) return;

      // If clicking the same square, increment click count
      if (selectedSquare === squareId) {
        clickCount++;
      } else {
        // Reset for new square
        clearSquareHighlights();
        selectedSquare = squareId;
        clickCount = 1;
      }

      // Apply highlighting based on click count
      if (clickCount === 1) {
        // Light green for first click
        canvas.style.backgroundColor = '#90EE90';
      } else if (clickCount === 2) {
        // Purple for second click
        canvas.style.backgroundColor = '#ba9cf7';
      } else {
        // Reset after second click
        clearSquareHighlights();
        selectedSquare = null;
        clickCount = 0;
      }
    }

    function clearSquareHighlights() {
      console.log('clearSquareHighlights');
      document.getElementById('debug').innerHTML += 'clearSquareHighlights' + '\n';
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
          const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
          const squareId = `sq-${files[col]}${ranks[row]}`;
          const canvas = document.getElementById(squareId);
          
          if (canvas) {
            // Reset to original square colors
            const isWhiteSquare = (row + col) % 2 === 0;
            canvas.style.backgroundColor = '';
            if (isWhiteSquare) {
              canvas.className = canvas.className.replace(/square-(black|white)/, 'square-white');
            } else {
              canvas.className = canvas.className.replace(/square-(black|white)/, 'square-black');
            }
          }
        }
      }
    }
    function scrollDebugToBottom() {
      const debugPanel = document.querySelector('.debug-panel');
      if (debugPanel) {
        debugPanel.scrollTop = debugPanel.scrollHeight;
      }
    }

    // Auto-scroll debug panel whenever content is added
    function addDebugMessage(message) {
      document.getElementById('debug').innerHTML += message + '\n';
      // Use setTimeout to ensure DOM is updated before scrolling
      setTimeout(() => {
        scrollDebugToBottom();
      }, 0);
    }

    // Override the direct debug innerHTML updates to use auto-scroll
    const originalDebugElement = document.getElementById('debug');
    if (originalDebugElement) {
      const observer = new MutationObserver(() => {
        setTimeout(() => {
          scrollDebugToBottom();
        }, 0);
      });
      observer.observe(originalDebugElement, { childList: true, subtree: true, characterData: true });
    }
      
    }
