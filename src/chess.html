<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Chess</title>
  <style>
    body { 
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;    
      font-weight: 300;
      background-color: black;
      color: white;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .chessboard-container {
      text-align: center;
      color: black;
      position: relative;
    }

    .debug-panel {
      /* background-color: #1a1a1a; */
      /* color: #00ff00; */
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 10px;
      margin-left: 30px;
      border-radius: 5px;
      width: 200px;
      height: 500px;
      overflow-y: auto;
      /* border: 1px solid #333; */
      position: relative;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      /* Hide scrollbar in WebKit browsers */
      
    }

    /* Proper webkit scrollbar rule (not nested) */
    .debug-panel::-webkit-scrollbar {
      display: none;
    }

    .debug-panel pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    table.chessboard {
      border-collapse: collapse;
      table-layout: fixed;
      width: 320px;
      border-radius: 8px;
      overflow: hidden;
    }

    table.chessboard td {
      overflow: hidden;
      width: 40px;
      height: 40px;
      padding: 0px;
      margin: 0px;
    }

    table.chessboard td.coord {
      overflow: hidden;
      width: 40px;
      height: 40px;
      padding: 0px;
      margin: 0px;
      text-align: center;
      vertical-align: middle;
      background: #f0f0f0;
      font-size: 14px;
    }

    table.chessboard td canvas {
      width: 40px;
      height: 40px;
      vertical-align: bottom;
      cursor: pointer;
      border: none;
    }

    .square-black {
      background-color: #e2c3ac;
    }

    .square-white {
      background-color: #ffffff;
    }

    .coord {
      pointer-events: none;
      user-select: none;
    }

    /* Floating capture animation layer */
    .float-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .float-piece {
      position: absolute;
      width: 40px;
      height: 40px;
      will-change: transform, opacity;
      image-rendering: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Reconnect modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      width: 320px;
      color: #fff;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .modal h2 {
      margin: 0 0 8px 0;
      font-weight: 600;
      font-size: 18px;
    }

    .modal p {
      margin: 0 0 12px 0;
      color: #bbb;
      font-size: 14px;
      line-height: 1.4;
    }

    .modal .actions {
      margin-top: 10px;
    }

    .modal button {
      background: #f0f0f0;
      border: none;
      color: #333;
      cursor: pointer;
      font-family: monospace;
      font-size: 14px;
    }

    .modal button:hover {
      background: #e0e0e0;
      border-color: #999;
    }

    .modal button:active {
      background: #d0d0d0;
    }

    /* Loading spinner on the button
    .modal button.loading {
      position: relative;
      padding-right: 28px;
    } */

    /* .modal button.loading:after {
      content: '';
      position: absolute;
      top: 50%;
      right: 10px;
      width: 14px;
      height: 14px;
      margin-top: -7px;
      border: 2px solid #999;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    } */

    /* Modal pulse while reconnecting */
    .modal.pulsing {
      animation: pulseModal 1.2s ease-in-out infinite;
    }

    @keyframes pulseModal {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .modal .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

  <script type="module">
    import { getPossibleMoves } from '/getPossibleMoves.js';

    let ws = null;
    // Global game/UI state
    let currentBoard = null;
    let selectedSquare = null;
    let clickCount = 0;
    let listenersInitialized = false;
    let reconnecting = false;
    const MIN_RECONNECT_MS = 10000;
    let reconnectStartAt = 0;
    const MIN_RECONNECT_ATTEMPTS = 10;
    const RECONNECT_INTERVAL_MS = 1000;
    const CONNECT_ATTEMPT_TIMEOUT_MS = 900;
    let reconnectAttempts = 0;
    let reconnectLoopTimer = null;
    let connectAttemptTimer = null;
    let reconnectSucceeded = false;

    // Piece image map (shared across render functions)
    const PIECES = {
      'K': '/pieces/simple/white_king_alive.png',
      'Q': '/pieces/simple/white_queen_alive.png', 
      'R': '/pieces/simple/white_rook_alive.png',
      'B': '/pieces/simple/white_bishop_alive.png',
      'N': '/pieces/simple/white_knight_alive.png',
      'P': '/pieces/simple/white_pawn_alive.png',
      'k': '/pieces/simple/black_king_alive.png',
      'q': '/pieces/simple/black_queen_alive.png',
      'r': '/pieces/simple/black_rook_alive.png',
      'b': '/pieces/simple/black_bishop_alive.png',
      'n': '/pieces/simple/black_knight_alive.png',
      'p': '/pieces/simple/black_pawn_alive.png'
    };

    // Hover preview state/handlers
    const hoverHandlers = new Map(); // squareId -> { enter, leave }
    let previewedSquareId = null;

    function getPieceImageSrc(piece) {
      return piece && PIECES[piece] ? PIECES[piece] : null;
    }

    function getSquareIdFromRowCol(row, col) {
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
      return `sq-${files[col]}${ranks[row]}`;
    }

    function parseSquareId(squareId) {
      const m = squareId.match(/^sq-([a-h])([1-8])$/);
      if (!m) return null;
      const col = m[1].charCodeAt(0) - 'a'.charCodeAt(0);
      const row = 8 - parseInt(m[2], 10);
      return { row, col };
    }

    function renderSquare(row, col) {
      if (!currentBoard) return;
      const squareId = getSquareIdFromRowCol(row, col);
      const canvas = document.getElementById(squareId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = 1000;
      canvas.height = 1000;
      ctx.clearRect(0, 0, 1000, 1000);
      const piece = currentBoard[row][col];
      const src = getPieceImageSrc(piece);
      if (src) {
        const img = new Image();
        img.onload = function() {
          ctx.drawImage(img, 0, 0, 1000, 1000);
        };
        img.src = src;
      }
    }

    function makeWebSocketCall(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
      }
    }

    function isConnected() {
      return ws && ws.readyState === WebSocket.OPEN;
    }

    function showReconnectModal() {
      const modal = document.getElementById('reconnectModal');
      if (modal) {
        modal.style.display = 'flex';
      }
    }

    function hideReconnectModal() {
      const modal = document.getElementById('reconnectModal');
      if (modal) {
        modal.style.display = 'none';
      }
    }

    function setReconnectBtnState(disabled, label) {
      const btn = document.getElementById('reconnectBtn');
      if (btn) {
        btn.disabled = !!disabled;
        if (label) btn.textContent = label;
      }
    }

    function getInnerModal() {
      const overlay = document.getElementById('reconnectModal');
      return overlay ? overlay.querySelector('.modal') : null;
    }

    function beginReconnectUI() {
      showReconnectModal();
      setReconnectBtnState(true, 'Reconnecting...');
      const btn = document.getElementById('reconnectBtn');
      if (btn) btn.classList.add('loading');
      const inner = getInnerModal();
      if (inner) inner.classList.add('pulsing');
      reconnectStartAt = performance.now();
    }

    function finalizeReconnectUI(success) {
      const elapsed = reconnectStartAt ? (performance.now() - reconnectStartAt) : MIN_RECONNECT_MS;
      const remaining = Math.max(0, MIN_RECONNECT_MS - elapsed);
      const finish = () => {
        const btn = document.getElementById('reconnectBtn');
        if (btn) btn.classList.remove('loading');
        const inner = getInnerModal();
        if (inner) inner.classList.remove('pulsing');
        setReconnectBtnState(false, 'Reconnect');
        reconnecting = false;
        reconnectStartAt = 0;
        if (success) {
          hideReconnectModal();
        } else {
          showReconnectModal();
        }
      };
      // If reconnection succeeded, hide immediately without waiting the minimum duration
      if (success) {
        finish();
      } else {
        setTimeout(finish, remaining);
      }
    }

    function getGameIdFromPath() {
      // Expecting /game/<uuid>
      const parts = location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('game');
      if (idx !== -1 && parts[idx + 1]) {
        return parts[idx + 1];
      }
      return null;
    }

    function getWsUrl() {
      let roomId = getGameIdFromPath();
      if (!roomId) {
        // If user navigated directly to root or invalid path, bounce to a new game
        const newId = crypto.randomUUID().replace(/-/g, '');
        location.replace(`/game/${newId}`);
        // Return a placeholder; caller will reconnect after navigation
        return '';
      }
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      const host = location.host;
      return `${protocol}://${host}/api/room/${roomId}/websocket`;
    }

    function clearReconnectTimers() {
      if (reconnectLoopTimer) {
        clearInterval(reconnectLoopTimer);
        reconnectLoopTimer = null;
      }
      if (connectAttemptTimer) {
        clearTimeout(connectAttemptTimer);
        connectAttemptTimer = null;
      }
    }

    function stopReconnectLoop() {
      clearReconnectTimers();
    }

    function safeCloseCurrentSocket() {
      try {
        if (ws && ws.readyState !== WebSocket.CLOSED && ws.readyState !== WebSocket.CLOSING) {
          ws.onopen = null;
          ws.onmessage = null;
          ws.onerror = null;
          ws.onclose = null;
          ws.close();
        }
      } catch (e) {
        // ignore
      }
    }

    function attemptReconnectOnce() {
      if (reconnectSucceeded) return;
      reconnectAttempts++;
      const wsUrl = getWsUrl();

      safeCloseCurrentSocket();
      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        // will retry on next tick
        return;
      }

      ws.onopen = function() {
        // on success, finalize UI (with min duration) and stop loop
        document.getElementById('debug').innerHTML += 'Reconnected to chess game' + '\n';
        reconnectSucceeded = true;
        stopReconnectLoop();
        finalizeReconnectUI(true);
        hideReconnectModal();
        reconnecting = false;
        // Re-render last known board immediately to avoid visual clearing
        if (currentBoard) {
          updateBoard(currentBoard);
        }
      };

      ws.onmessage = function(event) {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (e) {
          console.error('Invalid message payload', event.data);
          return;
        }
        if (data && data.type === 'board' && Array.isArray(data.board)) {
          printBoard(data.board);
          updateBoard(data.board);
          // Fallback: ensure modal is hidden when we receive a valid board
          hideReconnectModal();
          reconnecting = false;
        }
      };

      ws.onerror = function() {
        // keep trying
      };

      ws.onclose = function() {
        // keep trying
      };

      // If still connecting after timeout, abort and let the loop retry next tick
      connectAttemptTimer = setTimeout(() => {
        if (ws && ws.readyState === WebSocket.CONNECTING) {
          safeCloseCurrentSocket();
        }
      }, CONNECT_ATTEMPT_TIMEOUT_MS);
    }

    function startReconnectLoop() {
      reconnectSucceeded = false;
      reconnectAttempts = 0;
      clearReconnectTimers();
      beginReconnectUI();
      attemptReconnectOnce();
      const loopStart = performance.now();
      reconnectLoopTimer = setInterval(() => {
        if (reconnectSucceeded) {
          stopReconnectLoop();
          return;
        }
        const elapsed = performance.now() - loopStart;
        // Keep attempting every second; ensure we make at least MIN_RECONNECT_ATTEMPTS attempts
        if (reconnectAttempts < MIN_RECONNECT_ATTEMPTS || elapsed < MIN_RECONNECT_MS) {
          attemptReconnectOnce();
        } else {
          // Past minimums; keep trying until success to ensure reconnection works
          attemptReconnectOnce();
        }
      }, RECONNECT_INTERVAL_MS);
    }

    // Connect to WebSocket
    function connectWebSocket() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
      }
      const wsUrl = getWsUrl();
      if (!wsUrl) return;
      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        finalizeReconnectUI(false);
        return;
      }
      
      ws.onopen = function() {
        console.log('Connected to chess game');
        document.getElementById('debug').innerHTML += 'Connected to chess game' + '\n';
        // ASCII art welcome message
        document.getElementById('debug').innerHTML += '<div style="color: #666; font-family: monospace; line-height: 1; font-size: 10px; margin: 10px 0;">' +
          '         ,....,<br>' +
          '      ,::::::<&lt;<br>' +
          '     ,::/^\\"``..<br>' +
          '    ,::/, `   e`.<br>' +
          '   ,::; |        \'.<br>' +
          '   ,::|  \\___,-.  c)<br>' +
          '   ;::|     \\   \'-\'<br>' +
          '   ;::|      \\<br>' +
          '   ;::|   _.=`\\<br>' +
          '   `;:|.=` _.=`\\<br>' +
          '     \'|_.=`   __\\<br>' +
          '     `\\_..==`` /<br>' +
          '      .\'.___.-\'.<br>' +
          '     /          \\<br>' +
          '    (\'--......--\')<br>' +
          '    /\'--......--\'\\<br>' +
          '    `"--......--"<br>' +
          '</div>';
        document.getElementById('debug').innerHTML += '<span style="color: #999;">Rules are simple, whatever the computer allows, try double clicking some squares! :)</span><br>' + '\n';
        if (reconnecting) {
          finalizeReconnectUI(true);
        } else {
          hideReconnectModal();
        }
      };
      
      ws.onmessage = function(event) {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (e) {
          console.error('Invalid message payload', event.data);
          return;
        }
        if (data && data.type === 'board' && Array.isArray(data.board)) {
          printBoard(data.board);
          updateBoard(data.board);
        }
      };
      
      ws.onclose = function() {
        console.log('Disconnected from chess game');
        document.getElementById('debug').innerHTML += 'Disconnected from chess game' + '\n';
        showReconnectModal();
        setReconnectBtnState(false, 'Reconnect');
        reconnecting = false;
      };
      
      ws.onerror = function(error) {
        console.error('WebSocket error:', error);
        document.getElementById('debug').innerHTML += 'WebSocket error: ' + error + '\n';
        showReconnectModal();
        setReconnectBtnState(false, 'Reconnect');
        reconnecting = false;
      };
    }
    
    // Connect when page loads (initial, no modal shown)
    connectWebSocket();

    const reconnectBtn = document.getElementById('reconnectBtn');
    if (reconnectBtn) {
      reconnectBtn.addEventListener('click', () => {
        if (reconnecting) return;
        reconnecting = true;
        startReconnectLoop();
      }, { passive: true });
    }

    function printBoard(board) {
      console.log('Board state:');
      for (let row = 0; row < 8; row++) {
        let rowStr = '';
        for (let col = 0; col < 8; col++) {
          const piece = board[row][col];
          if (piece) {
            // Use colored styling for pieces
            if (piece === piece.toUpperCase()) {
              // White pieces - blue color
              rowStr += `<span style="color: #0066cc; font-weight: bold;">${piece}</span> `;
            } else {
              // Black pieces - red color
              rowStr += `<span style="color: #cc0000; font-weight: bold;">${piece}</span> `;
            }
          } else {
            // Empty square
            rowStr += '<span style="color: #999;">.</span> ';
          }
        }
        console.log(`${8 - row}: ${rowStr}`);
        document.getElementById('debug').innerHTML += `<div style="font-family: monospace; line-height: 1.2;">${8 - row}: ${rowStr}</div>`;
      }
      document.getElementById('debug').innerHTML += '<div style="font-family: monospace; margin-bottom: 10px;">   a b c d e f g h</div>';
    }

    function updateBoard(board) {
      console.log('Updating board:', board);
      document.getElementById('debug').innerHTML += 'Updating board' + '\n';
      const prevBoard = currentBoard ? currentBoard.map(row => row.slice()) : null;
      currentBoard = board;

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = board[row][col];
          const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
          const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
          const squareId = `sq-${files[col]}${ranks[row]}`;
          const canvas = document.getElementById(squareId);
          
          if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = 1000;
            canvas.height = 1000;
            ctx.clearRect(0, 0, 1000, 1000);
            if (piece && PIECES[piece]) {
              const img = new Image();
              img.onload = function() {
                ctx.drawImage(img, 0, 0, 1000, 1000);
              };
              img.src = PIECES[piece];
            }
          }
        }
      }

      // After rendering, detect captures by comparing prevBoard to currentBoard
      if (prevBoard) {
        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const prevPiece = prevBoard[row][col];
            const curPiece = currentBoard[row][col];
            if (prevPiece && curPiece && prevPiece !== curPiece) {
              // A piece changed at destination -> likely captured prevPiece here
              spawnFloatingPiece(row, col, prevPiece);
            }
          }
        }
      }
    }

    function getBoardClientRect() {
      const table = document.querySelector('table.chessboard');
      if (!table) return null;
      return table.getBoundingClientRect();
    }

    function squareToClientPosition(row, col) {
      const boardRect = getBoardClientRect();
      if (!boardRect) return null;
      // Account for the coordinate border row/col (table has a frame of coords)
      // The actual board cells are 8x8 inside the 10x10 table grid
      const cellSize = 40; // matches CSS width/height
      const topOffset = boardRect.top + cellSize; // skip top coord row
      const leftOffset = boardRect.left + cellSize; // skip left coord col
      return {
        x: leftOffset + col * cellSize,
        y: topOffset + row * cellSize,
        size: cellSize
      };
    }

    function spawnFloatingPiece(row, col, piece) {
      const src = getPieceImageSrc(piece);
      if (!src) return;
      const layer = document.getElementById('float-layer');
      if (!layer) return;
      const pos = squareToClientPosition(row, col);
      if (!pos) return;

      const img = new Image();
      img.src = src;
      img.className = 'float-piece';
      // Position relative to layer; convert client coords to layer-local by subtracting container's client rect
      const containerRect = layer.getBoundingClientRect();
      img.style.left = (pos.x - containerRect.left) + 'px';
      img.style.top = (pos.y - containerRect.top) + 'px';
      img.style.opacity = '1';
      layer.appendChild(img);

      const startY = pos.y - containerRect.top;
      const startX = pos.x - containerRect.left;
      const durationMs = 1200 + Math.random() * 600; // 1.2s - 1.8s
      const driftX = (Math.random() * 16 - 8); // slight lateral drift
      const jitterAmp = 2 + Math.random() * 3; // px
      const start = performance.now();

      function animate(now) {
        const t = Math.min(1, (now - start) / durationMs);
        // ease-out cubic
        const ease = 1 - Math.pow(1 - t, 3);
        const jitter = Math.sin(now / 40 + row * 3 + col * 5) * jitterAmp * (1 - t);
        const y = startY - ease * (boardRectHeight() + 60); // move up out of frame
        const x = startX + ease * driftX + jitter * 0.3;
        img.style.transform = `translate(${x - startX}px, ${y - startY}px)`;
        img.style.opacity = String(1 - t);
        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          if (img.parentNode) img.parentNode.removeChild(img);
        }
      }

      function boardRectHeight() {
        const rect = getBoardClientRect();
        return rect ? rect.height : 320;
      }

      requestAnimationFrame(animate);
    }

    // One-time initialization of click handlers for all squares
    function initializeSquareListeners() {
      if (listenersInitialized) return;
      listenersInitialized = true;
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
          const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
          const squareId = `sq-${files[col]}${ranks[row]}`;
          const canvas = document.getElementById(squareId);
          if (canvas) {
            canvas.addEventListener('click', () => handleSquareClick(squareId, row, col), { passive: true });
          }
        }
      }
      document.getElementById('debug').innerHTML += 'Square listeners initialized' + '\n';
    }

    function handleSquareClick(squareId, row, col) {
      console.log('handleSquareClick', squareId, row, col);
      document.getElementById('debug').innerHTML += '<span style="color: #00ff88;">handleSquareClick</span> <span style="color: #ffaa00;">' + squareId + '</span> <span style="color: #88aaff;">' + row + '</span> <span style="color: #ff88aa;">' + col + '</span>\n';
      if (!isConnected()) {
        showReconnectModal();
        return;
      }
      const canvas = document.getElementById(squareId);
      if (!canvas || !currentBoard) return;

      const clickedPiece = currentBoard[row][col];

      if (selectedSquare === squareId) {
        clickCount++;
      } else {
        if (selectedSquare && clickCount > 0) {
          const fromSquare = selectedSquare;
          const toSquare = squareId;
          const fromMatch = fromSquare.match(/sq-([a-h])([1-8])/);
          const toMatch = toSquare.match(/sq-([a-h])([1-8])/);
          if (fromMatch && toMatch) {
            const fromCol = fromMatch[1].charCodeAt(0) - 'a'.charCodeAt(0);
            const fromRow = 8 - parseInt(fromMatch[2]);
            const toCol = toMatch[1].charCodeAt(0) - 'a'.charCodeAt(0);
            const toRow = 8 - parseInt(toMatch[2]);
            const piece = currentBoard[fromRow][fromCol];
            if (piece && isValidMove(piece, fromRow, fromCol, toRow, toCol, clickCount >= 2)) {
              const move = { type: 'move', from: fromMatch[1] + fromMatch[2], to: toMatch[1] + toMatch[2], isDoubleMove: clickCount >= 2 };
              console.log('Sending move:', move);
              document.getElementById('debug').innerHTML += '<span style="color: #00ff88;">Sending move:</span> <span style="color: #ffaa00;">' + JSON.stringify(move) + '</span>\n';
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(move));
              }
              clearSquareHighlights();
              selectedSquare = null;
              clickCount = 0;
              return;
            } else {
              console.log('Invalid move attempted');
              document.getElementById('debug').innerHTML += 'Invalid move attempted\n';
              clearSquareHighlights();
              selectedSquare = squareId;
              clickCount = 1;
              if (clickedPiece) {
                canvas.style.backgroundColor = '#90EE90';
                highlightPossibleMoves(row, col, false);
              } else {
                selectedSquare = null;
                clickCount = 0;
              }
              return;
            }
          }
        }
        clearSquareHighlights();
        selectedSquare = squareId;
        clickCount = 1;
      }

      if (clickedPiece) {
        if (clickCount === 1) {
          canvas.style.backgroundColor = '#90EE90';
          highlightPossibleMoves(row, col, false);
        } else if (clickCount === 2) {
          canvas.style.backgroundColor = '#ba9cf7';
          highlightPossibleMoves(row, col, true);
        } else {
          clearSquareHighlights();
          selectedSquare = null;
          clickCount = 0;
        }
      } else {
        clearSquareHighlights();
        selectedSquare = null;
        clickCount = 0;
      }
    }

    function isValidMove(piece, fromRow, fromCol, toRow, toCol, isDoubleMove = false) {
      if (!piece || !currentBoard) return false;
      if (toRow < 0 || toRow >= 8 || toCol < 0 || toCol >= 8) return false;
      const targetPiece = currentBoard[toRow][toCol];
      const isWhite = piece === piece.toUpperCase();
      if (targetPiece && (targetPiece === targetPiece.toUpperCase()) === isWhite) {
        return false;
      }
      const possibleMoves = getPossibleMoves(currentBoard, piece, fromRow, fromCol, isDoubleMove);
      return possibleMoves.some(move => move[0] === toRow && move[1] === toCol);
    }

    function highlightPossibleMoves(row, col, isDoubleMove = false) {
      if (!currentBoard) return;
      const piece = currentBoard[row][col];
      if (!piece) return;
      const moves = getPossibleMoves(currentBoard, piece, row, col, isDoubleMove);
      for (const move of moves) {
        const [moveRow, moveCol] = move;
        if (moveRow >= 0 && moveRow < 8 && moveCol >= 0 && moveCol < 8) {
          const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
          const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
          const moveSquareId = `sq-${files[moveCol]}${ranks[moveRow]}`;
          const moveCanvas = document.getElementById(moveSquareId);
          if (moveCanvas) {
            const isWhiteSquare = (moveRow + moveCol) % 2 === 0;
            if (isDoubleMove) {
              if (isWhiteSquare) moveCanvas.style.backgroundColor = '#f0e6ff';
              else moveCanvas.style.backgroundColor = '#e0d6f0';

              // Set up hover preview of the moving piece at half opacity
              // Remove any existing handlers first
              const existing = hoverHandlers.get(moveSquareId);
              if (existing) {
                moveCanvas.removeEventListener('mouseenter', existing.enter, { passive: true });
                moveCanvas.removeEventListener('mouseleave', existing.leave, { passive: true });
                hoverHandlers.delete(moveSquareId);
              }

              const onEnter = () => {
                // Only show preview if still in double-move state
                if (!(selectedSquare && clickCount >= 2)) return;
                const ctx = moveCanvas.getContext('2d');
                const src = getPieceImageSrc(piece);
                if (!src) return;
                const img = new Image();
                img.onload = function() {
                  previewedSquareId = moveSquareId;
                  ctx.save();
                  ctx.globalAlpha = 0.5;
                  ctx.drawImage(img, 0, 0, 1000, 1000);
                  ctx.restore();
                };
                img.src = src;
              };

              const onLeave = () => {
                if (previewedSquareId === moveSquareId) previewedSquareId = null;
                renderSquare(moveRow, moveCol);
              };

              moveCanvas.addEventListener('mouseenter', onEnter, { passive: true });
              moveCanvas.addEventListener('mouseleave', onLeave, { passive: true });
              hoverHandlers.set(moveSquareId, { enter: onEnter, leave: onLeave });
            } else {
              if (isWhiteSquare) moveCanvas.style.backgroundColor = '#ffe6f0';
              else moveCanvas.style.backgroundColor = '#f0d6e0';
            }
          }
        }
      }
    }

    function clearSquareHighlights() {
      // Remove hover handlers and clean any lingering preview
      if (previewedSquareId) {
        const parsed = parseSquareId(previewedSquareId);
        if (parsed) {
          renderSquare(parsed.row, parsed.col);
        }
        previewedSquareId = null;
      }
      if (hoverHandlers.size > 0) {
        hoverHandlers.forEach((handlers, squareId) => {
          const canvas = document.getElementById(squareId);
          if (canvas) {
            canvas.removeEventListener('mouseenter', handlers.enter, { passive: true });
            canvas.removeEventListener('mouseleave', handlers.leave, { passive: true });
          }
        });
        hoverHandlers.clear();
      }
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
          const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
          const squareId = `sq-${files[col]}${ranks[row]}`;
          const canvas = document.getElementById(squareId);
          if (canvas) {
            const isWhiteSquare = (row + col) % 2 === 0;
            canvas.style.backgroundColor = '';
            if (isWhiteSquare) {
              canvas.className = canvas.className.replace(/square-(black|white)/, 'square-white');
            } else {
              canvas.className = canvas.className.replace(/square-(black|white)/, 'square-black');
            }
          }
        }
      }
    }

    function scrollDebugToBottom() {
      const debugPanel = document.querySelector('.debug-panel');
      if (debugPanel) {
        debugPanel.scrollTop = debugPanel.scrollHeight;
      }
    }

    function addDebugMessage(message) {
      document.getElementById('debug').innerHTML += message + '\n';
      setTimeout(() => {
        scrollDebugToBottom();
      }, 0);
    }

    const originalDebugElement = document.getElementById('debug');
    if (originalDebugElement) {
      const observer = new MutationObserver(() => {
        setTimeout(() => {
          scrollDebugToBottom();
        }, 0);
      });
      observer.observe(originalDebugElement, { childList: true, subtree: true, characterData: true });
    }

    // Initialize listeners once after DOM is ready (table exists above this script)
    initializeSquareListeners();
  </script>
